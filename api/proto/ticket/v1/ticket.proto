syntax = "proto3";

package nongnooch.ticket.v1;

option go_package = "nongnooch/platform/gen/go/ticket/v1;ticketv1";

service TicketService {
  rpc GetTickets(GetTicketsRequest) returns (GetTicketsResponse);
  rpc VoidTickets(VoidTicketsRequest) returns (VoidTicketsResponse);
}

message Ticket {
  string ticket_id = 1;
  string kind = 2;
  string visit_date = 3;
  string holder_name = 4;
  string status = 5; // active|used|void|transferred
  string qr = 6;
}

message GetTicketsRequest { string order_id = 1; }
message GetTicketsResponse {
  repeated Ticket tickets = 1;
  bool complete = 2;
}

message VoidTicketsRequest {
  string order_id = 1;
  repeated string order_item_ids = 2; // empty = every ticket of the order
  string reason = 3;
}
message VoidTicketsResponse { int32 voided = 1; }
