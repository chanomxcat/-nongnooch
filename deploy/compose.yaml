name: nongnooch
services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
      - --performance-schema=OFF
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./deploy/mariadb-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 400m

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  mockext:
    build:
      context: .
      dockerfile: deploy/Dockerfile.go
      args: {SVC: mockext}
    image: nongnooch/mockext:dev
    ports: ["127.0.0.1:8090:8090"]
    environment:
      MOCKEXT_PUBLIC_URL: http://localhost:8090
      KBANK_API_KEY: demo-key
      KBANK_WEBHOOK_SECRET: demo-secret
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 64m

  identity:
    build:
      context: .
      dockerfile: deploy/Dockerfile.go
      args: {SVC: identity}
    image: nongnooch/identity:dev
    environment:
      DB_DSN: identity:identity@tcp(mariadb:3306)/identity?parseTime=true
      NATS_URL: nats://nats:4222
      DEMO_MODE: "true"
      TURNSTILE_VERIFY_URL: http://mockext:8090/turnstile/v0/siteverify
      TURNSTILE_SECRET: demo-turnstile-secret
      OTP_PEPPER: demo-otp-pepper-change-me
      # Relaxed demo OTP limits (prod defaults: 60 / 5 / 20).
      OTP_RESEND_COOLDOWN_SECONDS: "10"
      OTP_MAX_PER_CONTACT_PER_HOUR: "100"
      OTP_MAX_PER_IP_PER_HOUR: "1000"
      MEMBER_GRPC_ADDR: member:9090
      # DEMO ONLY Ed25519 key (public repo, not a secret). Real envs inject via secret manager.
      JWT_ED25519_KEY: |
        -----BEGIN PRIVATE KEY-----
        MC4CAQAwBQYDK2VwBCIEIAINhylNwNRlBnWSqDUkRkc2+cBIaq6j5JnzmVcimnNM
        -----END PRIVATE KEY-----
    depends_on:
      mariadb: {condition: service_healthy}
      nats: {condition: service_healthy}
      mockext: {condition: service_healthy}
    mem_limit: 96m

  member:
    build:
      context: .
      dockerfile: deploy/Dockerfile.go
      args: {SVC: member}
    image: nongnooch/member:dev
    environment:
      DB_DSN: member:member@tcp(mariadb:3306)/member?parseTime=true
      NATS_URL: nats://nats:4222
      DEMO_MODE: "true"
      # DEMO ONLY keys (public repo, not secrets). Real envs inject via secret manager.
      MEMBER_ID_ENC_KEY: ZGVtby1tZW1iZXItaWQtZW5jLWtleS0zMmJ5dGVzISE=
      MEMBER_ID_ENC_KID: "1"
      MEMBER_ID_HMAC_KEY: ZGVtby1tZW1iZXItaWQtaG1hYy1rZXktMzJieXRlcyEh
      POINTS_WELCOME: "100"
      POINTS_INVITE: "50"
    depends_on:
      mariadb: {condition: service_healthy}
      nats: {condition: service_healthy}
    mem_limit: 96m

  commerce:
    build:
      context: .
      dockerfile: deploy/Dockerfile.go
      args: {SVC: commerce}
    image: nongnooch/commerce:dev
    environment:
      DB_DSN: commerce:commerce@tcp(mariadb:3306)/commerce?parseTime=true
      NATS_URL: nats://nats:4222
      DEMO_MODE: "true"
      KBANK_BASE_URL: http://mockext:8090/pg
      KBANK_API_KEY: demo-key
      KBANK_WEBHOOK_SECRET: demo-secret
      MEMBER_GRPC: member:9090
    depends_on:
      mariadb: {condition: service_healthy}
      nats: {condition: service_healthy}
      mockext: {condition: service_healthy}
    mem_limit: 96m

  ticket:
    build:
      context: .
      dockerfile: deploy/Dockerfile.go
      args: {SVC: ticket}
    image: nongnooch/ticket:dev
    environment:
      DB_DSN: ticket:ticket@tcp(mariadb:3306)/ticket?parseTime=true
      NATS_URL: nats://nats:4222
      DEMO_MODE: "true"
      # DEMO ONLY Ed25519 seed (public repo, not a secret). Real envs inject via secret manager.
      TICKET_SIGNING_KEY: ZGVtby10aWNrZXQtc2lnbmluZy1zZWVkLTMyYnl0ZSE=
    depends_on:
      mariadb: {condition: service_healthy}
      nats: {condition: service_healthy}
    mem_limit: 96m

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.go
      args: {SVC: gateway}
    image: nongnooch/gateway:dev
    ports: ["127.0.0.1:8000:8080"]
    environment:
      JWKS_URL: http://identity:8080/.well-known/jwks.json
      GATEWAY_SERVICES: identity,member,commerce,ticket,notify,content,agent,report
      # Peers allowed to set X-Forwarded-For: IPs, CIDRs or container names (re-resolved every 30s).
      TRUSTED_PROXIES: web,admin
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
    depends_on:
      identity: {condition: service_started}
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 64m

  notify:
    build:
      context: .
      dockerfile: deploy/Dockerfile.go
      args: {SVC: notify}
    image: nongnooch/notify:dev
    environment:
      DB_DSN: notify:notify@tcp(mariadb:3306)/notify?parseTime=true
      NATS_URL: nats://nats:4222
      DEMO_MODE: "true"
      SMS_BASE_URL: http://mockext:8090/sms
    depends_on:
      mariadb: {condition: service_healthy}
      nats: {condition: service_healthy}
      mockext: {condition: service_healthy}
    mem_limit: 96m

  content:
    build:
      context: .
      dockerfile: deploy/Dockerfile.go
      args: {SVC: content}
    image: nongnooch/content:dev
    environment:
      DB_DSN: content:content@tcp(mariadb:3306)/content?parseTime=true
      NATS_URL: nats://nats:4222
      DEMO_MODE: "true"
      APPROVAL_FOUR_EYES: "true"
      SITE_URL: http://localhost:3000
    depends_on:
      mariadb: {condition: service_healthy}
      nats: {condition: service_healthy}
    mem_limit: 96m

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args: {APP: web, NEXT_PUBLIC_DEMO_TOOLS: "true", NEXT_PUBLIC_TURNSTILE_MODE: mock}
    image: nongnooch/web:dev
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GATEWAY_URL: http://gateway:8080
      SITE_URL: http://localhost:3000
      MOCKEXT_PUBLIC_URL: http://localhost:8090
      NEXT_PUBLIC_TURNSTILE_MODE: mock
      NEXT_PUBLIC_DEMO_TOOLS: "true"
    depends_on:
      gateway: {condition: service_started}
      content: {condition: service_started}
    mem_limit: 256m

  admin:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args: {APP: admin}
    image: nongnooch/admin:dev
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GATEWAY_URL: http://gateway:8080
      SITE_URL: http://localhost:3001
    depends_on:
      gateway: {condition: service_started}
    mem_limit: 256m

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      args: {API_BASE: "http://localhost:8000", WEB_BASE: "http://localhost:3000", MOCKEXT_BASE: "http://localhost:8090", DEMO: "true"}
    image: nongnooch/app:dev
    ports: ["127.0.0.1:3002:80"]
    mem_limit: 64m

  node:
    image: node:20-bookworm
    profiles: [tools]
    working_dir: /src
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/src
      - nodemods:/src/node_modules
      - npmcache:/root/.npm

  playwright:
    image: mcr.microsoft.com/playwright:v1.48.2-jammy
    profiles: [e2e]
    working_dir: /src
    # Browser uses http://localhost:3000/3001/8090 like the host (TCP proxy, deploy/e2e/localhost-proxy.mjs).
    environment:
      MOCKEXT_URL: http://mockext:8090
      GATEWAY_URL: http://gateway:8080
    volumes:
      - .:/src
      - nodemods:/src/node_modules
    depends_on:
      web: {condition: service_started}
      admin: {condition: service_started}
      mockext: {condition: service_healthy}

  flutter:
    image: ghcr.io/cirruslabs/flutter:3.24.0
    profiles: [tools]
    working_dir: /src/apps/mobile
    environment:
      PUB_CACHE: /pub-cache
    volumes:
      - .:/src
      - pubcache:/pub-cache

  gotest:
    image: golang:1.23-bookworm
    profiles: [tools]
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    environment:
      TEST_DB_DSN: root:root@tcp(mariadb:3306)/test?parseTime=true&charset=utf8mb4
      TEST_NATS_URL: nats://nats:4222
    depends_on:
      mariadb: {condition: service_healthy}
      nats: {condition: service_healthy}

volumes:
  pubcache:
  mariadb-data:
  nats-data:
  gomod:
  gobuild:
  nodemods:
  npmcache:
